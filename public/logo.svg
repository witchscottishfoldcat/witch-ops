<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
  <defs>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#64d2ff"/>
      <stop offset="100%" stop-color="#bf5af2"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#232327"/>
      <stop offset="100%" stop-color="#151517"/>
    </linearGradient>
  </defs>
  <!-- 深色圆角底板 -->
  <rect x="1.5" y="1.5" width="45" height="45" rx="12" fill="url(#bgGrad)" stroke="rgba(255,255,255,0.09)" stroke-width="1"/>
  <!-- 极简线稿猫脸:一笔轮廓 -->
  <path d="M 15.5 21.5
           L 17.2 10.8
           L 24 16.2
           L 30.8 10.8
           L 32.5 21.5
           C 35.5 25.5, 35 32.5, 24 36.2
           C 13 32.5, 12.5 25.5, 15.5 21.5
           Z"
        fill="none"
        stroke="url(#lineGrad)"
        stroke-width="2.6"
        stroke-linejoin="round"
        stroke-linecap="round"/>
  <!-- 双眼:两个小圆点 -->
  <circle cx="20" cy="25.5" r="1.6" fill="url(#lineGrad)"/>
  <circle cx="28" cy="25.5" r="1.6" fill="url(#lineGrad)"/>
</svg>
